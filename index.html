<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Glückspalast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0716;--panel:#1a1230;--panel2:#241a40;--line:#3b2d62;--fg:#f4eefe;--muted:#a99cc8;--gold:#ffd23f;--pink:#ff3fa4;--cyan:#22e3ff;--green:#3dff8a;--display:'Bungee',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit}
/* Kopfzeile */
#top{position:fixed;left:0;right:0;top:0;padding:max(8px,env(safe-area-inset-top)) 10px 8px;display:flex;gap:8px;align-items:center;pointer-events:none;z-index:5}
.cur{pointer-events:auto;display:flex;align-items:center;gap:8px;background:rgba(20,13,38,.82);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:6px 12px 6px 8px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.cur .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px}
.cur b{font:400 20px var(--display);letter-spacing:.02em;display:block;line-height:1}
.cur small{color:var(--muted);font-size:11px;font-weight:700}
.chipic{background:radial-gradient(circle at 35% 30%,#fff6c8,#ffd23f 45%,#c98a00);box-shadow:0 0 14px rgba(255,210,63,.6)}
.dustic{background:radial-gradient(circle at 35% 30%,#ffe0ff,#c66bff 50%,#6a1fb0);box-shadow:0 0 14px rgba(198,107,255,.6)}
.staric{background:radial-gradient(circle at 35% 30%,#fff,#9fe9ff 50%,#1f7ab0);box-shadow:0 0 14px rgba(34,227,255,.5)}
#top .sp{flex:1}
.ver{pointer-events:auto;font:800 11px var(--body);color:#1b1400;background:var(--gold);border-radius:99px;padding:3px 8px}
#boost{pointer-events:none;position:fixed;top:calc(max(8px,env(safe-area-inset-top)) + 54px);left:50%;transform:translateX(-50%);z-index:5;font:400 14px var(--display);color:#1b1400;background:linear-gradient(90deg,#ffd23f,#ff8a3d);padding:6px 14px;border-radius:99px;box-shadow:0 0 24px rgba(255,180,0,.6);display:none;animation:pulse 1s infinite}
#chain{pointer-events:none;position:fixed;top:calc(max(8px,env(safe-area-inset-top)) + 100px);left:50%;transform:translate(-50%,-50%);z-index:6;font:400 clamp(22px,6vw,40px) var(--display);color:#fff;text-shadow:0 0 18px var(--pink),0 0 40px var(--pink);opacity:0;transition:opacity .3s}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.06)}}
/* Leiste unten */
#bar{position:fixed;left:0;right:0;bottom:0;padding:8px 8px max(8px,env(safe-area-inset-bottom));display:flex;gap:6px;justify-content:center;z-index:9;pointer-events:none}
#bar button{pointer-events:auto;position:relative;width:58px;height:58px;border-radius:18px;border:1px solid var(--line);background:rgba(26,18,48,.9);backdrop-filter:blur(8px);font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 8px 20px rgba(0,0,0,.4);transition:transform .12s}
#bar button small{font:800 9px var(--body);color:var(--muted)}
#bar button:active{transform:scale(.92)}
#bar button.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,210,63,.4),0 8px 20px rgba(0,0,0,.4)}
#bar button .dot{position:absolute;top:5px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);display:none}
#bar button.can .dot{display:block}
#bar button.lock{opacity:.45}
/* Upgrade-Fenster */
#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:min(100%,560px);max-height:min(56vh,520px);overflow:auto;z-index:8;background:rgba(22,15,42,.97);backdrop-filter:blur(12px);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:14px 14px calc(80px + env(safe-area-inset-bottom));transition:transform .32s cubic-bezier(.2,.9,.3,1);box-shadow:0 -20px 50px rgba(0,0,0,.5);touch-action:pan-y}
#sheet.open{transform:translate(-50%,0)}
#sheet h2{margin:0;font:400 20px var(--display);display:flex;align-items:center;gap:8px}
#sheet .x{margin-left:auto;border:0;background:var(--panel2);border-radius:12px;width:36px;height:36px;font-size:16px}
#sheet p.d{color:var(--muted);margin:4px 0 10px;font-size:13.5px}
.up{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px}
.up .i{font-size:26px;text-align:center}
.up b{font-size:15px}.up small{display:block;color:var(--muted);font-size:12.5px}
.up button{border:0;border-radius:12px;padding:10px 12px;min-width:96px;font:800 14px var(--body);background:linear-gradient(180deg,#ffd23f,#f0a500);color:#1b1400;box-shadow:0 4px 0 #8a5a00}
.up button:disabled{background:#3b2d62;color:#8a7cae;box-shadow:none}
.up button:not(:disabled):active{transform:translateY(2px);box-shadow:0 2px 0 #8a5a00}
.up.max button{background:#27a06a;color:#fff;box-shadow:none}
.tal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tal .br{display:flex;flex-direction:column;gap:8px}
.tal h3{margin:4px 0 0;font:400 13px var(--display);color:var(--muted);text-align:center}
.tn{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:8px 6px;text-align:center;font-size:12px;line-height:1.25;cursor:pointer;transition:transform .12s}
.tn .e{font-size:24px;display:block}.tn b{display:block;font-size:12.5px;margin:2px 0}
.tn.own{border-color:#c66bff;background:linear-gradient(180deg,rgba(198,107,255,.3),var(--panel));box-shadow:0 0 14px rgba(198,107,255,.35)}
.tn.lock{opacity:.4}.tn .c{display:inline-block;margin-top:4px;font-weight:800;color:#e6b3ff}
.big{width:100%;border:0;border-radius:16px;padding:14px;font:400 18px var(--display);background:linear-gradient(90deg,#ff3fa4,#a46bff);color:#fff;box-shadow:0 6px 0 #5a1f70;margin-top:6px}
.big:disabled{background:#3b2d62;box-shadow:none;color:#8a7cae}
/* Meldungen */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;background:rgba(20,13,38,.95);border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#modal{position:fixed;inset:0;z-index:20;background:rgba(5,3,12,.75);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;max-width:420px;text-align:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
#modal h2{font:400 26px var(--display);margin:0 0 8px;color:var(--gold)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
#zoomui{position:fixed;right:10px;bottom:calc(84px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;z-index:4}
#zoomui button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(26,18,48,.85);font-size:18px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <div class="cur"><span class="ic chipic">🪙</span><div><b id="vChips">0</b><small id="vRate">0 / s</small></div></div>
  <div class="cur" id="dustBox" style="display:none"><span class="ic dustic">✨</span><div><b id="vDust">0</b><small>Glücksstaub</small></div></div>
  <div class="cur" id="starBox" style="display:none"><span class="ic staric">⭐</span><div><b id="vStars">0</b><small id="vStarB">+0 %</small></div></div>
  <span class="sp"></span><span class="ver">v0.1 Test</span>
</div>
<div id="boost"></div>
<div id="chain"></div>
<div id="zoomui"><button data-z="in">＋</button><button data-z="out">－</button><button data-z="fit" title="Übersicht">⤢</button></div>
<div id="bar"></div>
<div id="sheet"></div>
<div id="toast"></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<script>
'use strict';
/* =========================================================
   Glückspalast v0.1 – Idle-Glücksspiel-Konstrukt
   Alle Maschinen stehen gleichzeitig auf einem Feld und sind
   über Röhren verbunden: Würfel → Automat / Rubbellos → Plinko
   ========================================================= */
const $ = s => document.querySelector(s);
const cv = $('#c'), cx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- Zahlen ---------- */
const UNITS = ['', ' Tsd.', ' Mio.', ' Mrd.', ' Bio.', ' Brd.', ' Trio.', ' Trd.', ' Quad.', ' Qrd.'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1).replace('.', ',') : Math.floor(n).toString();
  const e = Math.floor(Math.log10(n) / 3);
  let u = UNITS[e];
  if (!u && u !== '') { const k = e - UNITS.length; u = ' ' + String.fromCharCode(97 + Math.floor(k / 26)) + String.fromCharCode(97 + (k % 26)); }
  const v = n / Math.pow(1000, e);
  return (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2)).replace('.', ',') + u;
}

/* ---------- Spielstand ---------- */
const SAVE_KEY = 'gp.save.v1';
const fresh = () => ({
  chips: 0, run: 0, life: 0, dust: 0, stars: 0, resets: 0, tal: {}, t: Date.now(), rate: 0,
  dice: { n: 1, face: 0, speed: 0, gold: 0, auto: 0 },
  slot: { own: 0, reels: 3, val: 0, speed: 0, auto: 0 },
  scr: { own: 0, rate: 0, luck: 0, val: 0, auto: 0 },
  plk: { own: 0, val: 0, rows: 0, multi: 0, auto: 0 },
  stats: { rolls: 0, kniffel: 0, spins: 0, jack: 0, tickets: 0, balls: 0, chain: 0 },
});
let S = fresh();
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s) S = Object.assign(fresh(), s, { dice: { ...fresh().dice, ...s.dice }, slot: { ...fresh().slot, ...s.slot }, scr: { ...fresh().scr, ...s.scr }, plk: { ...fresh().plk, ...s.plk }, stats: { ...fresh().stats, ...s.stats } }); } catch {}
const save = () => { S.t = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch {} };

/* ---------- Talente (Glücksstaub) ---------- */
const TAL = [
  { b: 'Würfel', list: [
    { id: 'gezinkt', e: '🎲', n: 'Gezinkt', d: 'Würfel zeigen nie eine 1', c: 3 },
    { id: 'goldader', e: '🟨', n: 'Goldader', d: '+5 % Chance auf Goldwürfel', c: 6, req: 'gezinkt' },
    { id: 'sechser', e: '6️⃣', n: 'Sechser-Glück', d: 'Sechsen zählen doppelt', c: 12, req: 'goldader' },
    { id: 'kniffelstaub', e: '💫', n: 'Sternenwurf', d: 'Kniffel gibt 3 statt 1 Staub', c: 25, req: 'sechser' } ] },
  { b: 'Automaten', list: [
    { id: 'oel', e: '🛢️', n: 'Schmieröl', d: 'Alle Maschinen 25 % schneller', c: 3 },
    { id: 'wild', e: '🃏', n: 'Wilde Karte', d: 'Joker-Symbole doppelt so oft', c: 7, req: 'oel' },
    { id: 'roehre', e: '🧪', n: 'Jackpot-Röhre', d: 'Jeder Dreier schickt +1 Kugel', c: 14, req: 'wild' },
    { id: 'klee', e: '🍀', n: 'Glücksklee', d: 'Rubbellose gewinnen öfter', c: 20, req: 'roehre' } ] },
  { b: 'Glück', list: [
    { id: 'kapital', e: '💼', n: 'Startkapital', d: 'Maschinen kosten 50 % weniger zum Freischalten', c: 4 },
    { id: 'kette', e: '⛓️', n: 'Kettenreaktion', d: 'Ketten-Bonus +10 % statt +5 % pro Glied', c: 8, req: 'kapital' },
    { id: 'nacht', e: '🌙', n: 'Nachtschicht', d: 'Offline-Gewinn 100 % statt 50 %', c: 10, req: 'kette' },
    { id: 'sauger', e: '🌀', n: 'Staubsauger', d: '+50 % Glücksstaub', c: 18, req: 'nacht' } ] },
];
const has = id => !!S.tal[id];
const ALLT = TAL.flatMap(b => b.list);

/* ---------- Wirtschaft ---------- */
const UNLOCK = { slot: 400, scr: 15000, plk: 600000 };
const unlockCost = k => UNLOCK[k] * (has('kapital') ? 0.5 : 1);
const PRESTIGE_MIN = 5e7;
const starsFor = run => Math.floor(3 * Math.sqrt(run / PRESTIGE_MIN));
let boostMul = 1, boostEnd = 0;
const globalMul = () => (1 + S.stars * 0.2) * (Date.now() < boostEnd ? boostMul : 1);
const speedMul = () => (has('oel') ? 1.25 : 1);
const UP = {
  dice: [
    { k: 'n', e: '🎲', n: 'Noch ein Würfel', d: l => `${l} Würfel auf dem Tisch`, cost: l => 8 * Math.pow(1.42, l - 1), max: 40 },
    { k: 'face', e: '⬆️', n: 'Bessere Seiten', d: l => `Augenzahlen ×${fmt(Math.pow(2, l))}`, cost: l => 60 * Math.pow(4.2, l) },
    { k: 'speed', e: '⚡', n: 'Schnellere Hand', d: l => `Wurf alle ${diceCd().toFixed(2).replace('.', ',')} s`, cost: l => 40 * Math.pow(2.4, l), max: 15 },
    { k: 'gold', e: '🟨', n: 'Goldwürfel', d: l => `${goldChance(l)} % Chance pro Würfel auf ×5`, cost: l => 300 * Math.pow(3, l), max: 10 },
    { k: 'auto', e: '🤖', n: 'Helfer-Hand', d: l => (l ? `würfelt automatisch · Gewinn ×${l}` : 'würfelt automatisch für dich'), cost: l => 150 * Math.pow(6, l), max: 5 },
  ],
  slot: [
    { k: 'val', e: '💰', n: 'Höhere Gewinne', d: l => `Gewinne ×${fmt(Math.pow(2.2, l))}`, cost: l => 600 * Math.pow(3.6, l) },
    { k: 'reels', e: '🎰', n: 'Extra-Walze', d: l => `${l} Walzen – mehr Walzen, größere Reihen`, cost: l => 20000 * Math.pow(40, l - 3), max: 5, min: 3 },
    { k: 'speed', e: '⚡', n: 'Schnellere Walzen', d: l => `Dreh alle ${slotCd().toFixed(1).replace('.', ',')} s`, cost: l => 900 * Math.pow(2.5, l), max: 12 },
    { k: 'auto', e: '🤖', n: 'Hebel-Roboter', d: l => (l ? `dreht automatisch · Gewinn ×${l}` : 'dreht automatisch für dich'), cost: l => 2500 * Math.pow(6, l), max: 5 },
  ],
  scr: [
    { k: 'val', e: '💵', n: 'Wertvollere Lose', d: l => `Preise ×${fmt(Math.pow(2.3, l))}`, cost: l => 20000 * Math.pow(3.5, l) },
    { k: 'rate', e: '🖨️', n: 'Schnellerer Drucker', d: l => `neues Los alle ${scrCd().toFixed(1).replace('.', ',')} s`, cost: l => 25000 * Math.pow(2.4, l), max: 12 },
    { k: 'luck', e: '🍀', n: 'Glückslose', d: l => `+${l * 6} % Gewinnchance`, cost: l => 40000 * Math.pow(3.2, l), max: 8 },
    { k: 'auto', e: '🤖', n: 'Rubbel-Roboter', d: l => (l ? `rubbelt automatisch · Tempo ×${l}` : 'rubbelt Lose automatisch frei'), cost: l => 60000 * Math.pow(6, l), max: 5 },
  ],
  plk: [
    { k: 'val', e: '⚪', n: 'Schwerere Kugeln', d: l => `Kugelwert ×${fmt(Math.pow(2.4, l))}`, cost: l => 8e5 * Math.pow(3.6, l) },
    { k: 'rows', e: '📏', n: 'Mehr Reihen', d: l => `${8 + l} Reihen – höhere Rand-Multiplikatoren`, cost: l => 2e6 * Math.pow(4, l), max: 6 },
    { k: 'multi', e: '🔮', n: 'Multi-Kugel', d: l => `jeder Wurf: ${1 + l} Kugel${l ? 'n' : ''}`, cost: l => 3e6 * Math.pow(5, l), max: 5 },
    { k: 'auto', e: '🤖', n: 'Kugel-Kanone', d: l => (l ? `wirft automatisch · alle ${(autoCd(2.2, l) / speedMul()).toFixed(1).replace('.', ',')} s` : 'wirft Kugeln automatisch'), cost: l => 2e6 * Math.pow(6, l), max: 5 },
  ],
};
const diceCd = () => Math.max(0.22, 1.1 * Math.pow(0.86, S.dice.speed)) / speedMul();
const slotCd = () => Math.max(0.5, 3.2 * Math.pow(0.86, S.slot.speed)) / speedMul();
const scrCd = () => Math.max(0.8, 9 * Math.pow(0.85, S.scr.rate)) / speedMul();
const plkCd = () => 1.6 / speedMul();
const goldChance = l => l * 3 + (has('goldader') ? 5 : 0);
const autoCd = (base, l) => base * Math.pow(0.8, l - 1);

/* ---------- Welt / Layout ---------- */
const LAYOUTS = {
  quer: { dice: [0, 150], slot: [500, 0], scr: [500, 360], plk: [920, 0],
    pipes: { d2s: [[400, 260], [450, 260], [450, 145], [500, 145]], d2r: [[400, 380], [450, 380], [450, 510], [500, 510]],
      s2p: [[830, 120], [870, 120], [870, -40], [1110, -40], [1110, 20]], r2p: [[830, 520], [885, 520], [885, -60], [1130, -60], [1130, 20]] } },
  hoch: { dice: [0, 0], slot: [35, 420], scr: [35, 800], plk: [10, 1210],
    pipes: { d2s: [[400, 190], [440, 190], [440, 565], [365, 565]], d2r: [[400, 250], [470, 250], [470, 950], [365, 950]],
      s2p: [[35, 565], [-25, 565], [-25, 1165], [180, 1165], [180, 1230]], r2p: [[35, 950], [-55, 950], [-55, 1150], [220, 1150], [220, 1230]] } },
};
const M = {
  dice: { w: 400, h: 300, name: 'Würfeltisch', e: '🎲' },
  slot: { w: 330, h: 290, name: 'Spielautomat', e: '🎰' },
  scr: { w: 330, h: 300, name: 'Rubbellos-Drucker', e: '🎟️' },
  plk: { w: 380, h: 660, name: 'Plinko', e: '⚪' },
};
const owned = k => k === 'dice' || S[k].own;
// Röhren: Weg als Punkte, was hindurchrollt, wohin es führt
const PIPES = [
  { id: 'd2s', from: 'dice', to: 'slot', col: '#ffd23f' }, { id: 'd2r', from: 'dice', to: 'scr', col: '#3dff8a' },
  { id: 's2p', from: 'slot', to: 'plk', col: '#22e3ff' }, { id: 'r2p', from: 'scr', to: 'plk', col: '#ff3fa4' },
];
let layoutName = null;
function applyLayout(name) {
  if (name === layoutName) return; layoutName = name; const L = LAYOUTS[name];
  for (const k in M) { M[k].x = L[k][0]; M[k].y = L[k][1]; }
  PIPES.forEach(p => { p.pts = L.pipes[p.id]; p.len = []; let len = 0; for (let i = 1; i < p.pts.length; i++) { const d = Math.hypot(p.pts[i][0] - p.pts[i - 1][0], p.pts[i][1] - p.pts[i - 1][1]); p.len.push(d); len += d; } p.L = len; });
  if (typeof D !== 'undefined') { D.dice = []; PL.balls = []; tokens.forEach(tk => (tk.sp = 280 / tk.p.L)); }
}
function pipeAt(p, t) { let d = t * p.L; for (let i = 0; i < p.len.length; i++) { if (d <= p.len[i]) { const a = p.pts[i], b = p.pts[i + 1], f = d / p.len[i]; return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]; } d -= p.len[i]; } return p.pts[p.pts.length - 1]; }
const tokens = []; // was gerade durch Röhren rollt
function send(pipeId, kind, n = 1) {
  const p = PIPES.find(x => x.id === pipeId); if (!p || !owned(p.to)) return;
  for (let i = 0; i < n; i++) tokens.push({ p, kind, t: -i * 0.12, sp: 280 / p.L });
}

/* ---------- Kamera ---------- */
const cam = { x: 650, y: 330, z: 0.6, tx: null, ty: null, tz: null };
function worldBounds() { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const k in M) { if (!owned(k) && !nextLocked(k)) continue; const m = M[k]; x0 = Math.min(x0, m.x); y0 = Math.min(y0, m.y - 80); x1 = Math.max(x1, m.x + m.w); y1 = Math.max(y1, m.y + m.h); } return [x0, y0, x1, y1]; }
function nextLocked(k) { const order = ['slot', 'scr', 'plk']; const i = order.indexOf(k); if (i < 0) return false; return !S[k].own && (i === 0 || S[order[i - 1]].own); }
function fit(instant) { const [x0, y0, x1, y1] = worldBounds(); const pad = 30, top = 90, bot = 110; let z = clamp(Math.min((W - pad * 2) / (x1 - x0 + 120), (H - top - bot) / (y1 - y0)), 0.25, 1.4); let ty = (y0 + y1) / 2 - (top - bot) / 2 / z;

}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000;
  step(dt, t); draw(t);
  uiT -= dt; if (uiT <= 0) { uiT = 0.2; ui(); }
  saveT -= dt; if (saveT <= 0) { saveT = 5; save(); }
  requestAnimationFrame(frame);
}

/* =========================================================
   Oberfläche
   ========================================================= */
let sheetK = null;
const BAR = [['dice', '🎲', 'Würfel'], ['slot', '🎰', 'Slots'], ['scr', '🎟️', 'Lose'], ['plk', '⚪', 'Plinko'], ['tal', '✨', 'Talente'], ['bank', '♻️', 'Bankrott']];
$('#bar').innerHTML = BAR.map(([k, e, n]) => `<button data-b="${k}"><span class="dot"></span>${e}<small>${n}</small></button>`).join('');
function canBuy(k) { if (!owned(k)) return S.chips >= unlockCost(k); return UP[k].some(u => { const l = S[k][u.k]; return (u.max == null || l < u.max) && S.chips >= u.cost(l); }); }
function ui() {
  $('#vChips').textContent = fmt(S.chips);
  $('#vRate').textContent = fmt(S.rate * 1) + ' / s automatisch';
  $('#dustBox').style.display = S.dust || ALLT.some(x => has(x.id)) ? '' : 'none'; $('#vDust').textContent = fmt(S.dust);
  $('#starBox').style.display = S.stars || S.run >= PRESTIGE_MIN * 0.3 ? '' : 'none'; $('#vStars').textContent = S.stars; $('#vStarB').textContent = `+${S.stars * 20} % auf alles`;
  const bo = $('#boost'); if (Date.now() < boostEnd) { bo.style.display = 'block'; bo.textContent = `🌟 HEISSE HAND ×${boostMul} · ${Math.ceil((boostEnd - Date.now()) / 1000)} s`; } else bo.style.display = 'none';
  document.querySelectorAll('#bar button').forEach(b => {
    const k = b.dataset.b;
    if (M[k]) { b.classList.toggle('lock', !owned(k) && !nextLocked(k)); b.classList.toggle('can', canBuy(k)); }
    if (k === 'tal') b.classList.toggle('can', ALLT.some(x => !has(x.id) && (!x.req || has(x.req)) && S.dust >= x.c));
    if (k === 'bank') { b.classList.toggle('can', starsFor(S.run) > 0); b.style.display = S.run >= PRESTIGE_MIN * 0.3 || S.stars ? '' : 'none'; }
    b.classList.toggle('on', sheetK === k);
  });
  if (sheetK) renderSheet(true);
}
function renderSheet(soft) {
  const el = $('#sheet'), k = sheetK; let h = '';
  if (M[k]) {
    const m = M[k];
    if (!owned(k)) {
      h = `<h2>${m.e} ${m.name}<button class="x" data-x>✕</button></h2>`;
      h += nextLocked(k) ? `<p class="d">${{ slot: 'Würfel-Paschs werfen Münzen in die Röhre – jede Münze ist ein Freispiel am Automaten.', scr: 'Druckt Lose, die du freirubbelst. Würfel-Straßen schicken Bonus-Lose hinein.', plk: 'Kugeln fallen durch Stifte in Gewinnfächer. Automat und Rubbellose schießen Kugeln hinein.' }[k]}</p><button class="big" data-unlock="${k}" ${S.chips >= unlockCost(k) ? '' : 'disabled'}>🔓 Bauen für ${fmt(unlockCost(k))} 🪙</button>` : '<p class="d">Bau zuerst die Maschine davor.</p>';
    } else {
      h = `<h2>${m.e} ${m.name}<button class="x" data-x>✕</button></h2><p class="d">${{ dice: 'Die ersten 5 Würfel zählen für Kombis (Pasch → Münze in den Automaten, Straße → Bonus-Los, Kniffel → Glücksstaub!). Weitere Würfel bringen Augen.', slot: '3 gleiche Symbole schießen Kugeln ins Plinko. 🃏 ist Joker, 7️⃣7️⃣7️⃣ gibt Glücksstaub.', scr: '3 gleiche gewinnen. 🍀 gibt Glücksstaub, 💎 schickt 3 Kugeln ins Plinko.', plk: 'Randfächer zahlen am meisten und geben manchmal Glücksstaub.' }[k]}</p>`;
      h += UP[k].map(u => { const l = S[k][u.k], mx = u.max != null && l >= u.max, c = u.cost(l); return `<div class="up ${mx ? 'max' : ''}"><span class="i">${u.e}</span><div><b>${u.n} <small style="display:inline;color:var(--gold)">Stufe ${u.min ? l - u.min + 1 : l}</small></b><small>${u.d(l)}</small></div><button data-up="${k}:${u.k}" ${mx || S.chips < c ? 'disabled' : ''}>${mx ? 'Maximal' : fmt(c) + ' 🪙'}</button></div>`; }).join('');
    }
  } else if (k === 'tal') {
    h = `<h2>✨ Talentbaum<button class="x" data-x>✕</button></h2><p class="d">Glücksstaub bekommst du für seltene Treffer: Kniffel, 7️⃣7️⃣7️⃣, 🍀-Lose, Plinko-Randfächer und goldene Chips. Talente bleiben auch nach dem Bankrott.</p>
      <div class="tal">${TAL.map(b => `<div class="br"><h3>${b.b}</h3>${b.list.map(x => { const own = has(x.id), lock = x.req && !has(x.req); return `<div class="tn ${own ? 'own' : ''} ${lock ? 'lock' : ''}" data-tal="${x.id}"><span class="e">${x.e}</span><b>${x.n}</b>${x.d}${own ? '<span class="c">✓</span>' : `<span class="c">${x.c} ✨</span>`}</div>`; }).join('')}</div>`).join('')}</div>`;
  } else if (k === 'bank') {
    const st = starsFor(S.run);
    h = `<h2>♻️ Bankrott<button class="x" data-x>✕</button></h2><p class="d">Alles verspielen und neu anfangen: Chips, Maschinen und Upgrades sind weg – dafür bekommst du <b>Glückssterne</b>. Jeder Stern gibt dauerhaft +20 % auf alle Gewinne. Glücksstaub und Talente bleiben.</p>
      <div class="up"><span class="i">⭐</span><div><b>Jetzt: +${st} Glücksstern${st === 1 ? '' : 'e'}</b><small>Gewonnen in dieser Runde: ${fmt(S.run)} 🪙 · ab ${fmt(PRESTIGE_MIN)} gibt es Sterne</small></div><span></span></div>
      <button class="big" data-bank ${st > 0 ? '' : 'disabled'}>Alles auf Neu! (+${st} ⭐)</button>`;
  }
  if (soft && el.dataset.h === h) return; el.dataset.h = h; const sc = el.scrollTop; el.innerHTML = h; el.scrollTop = sc;
}
function openSheet(k) { sheetK = k; $('#sheet').classList.add('open'); renderSheet(); if (M[k]) focus(k); ui(); }
function closeSheet() { sheetK = null; $('#sheet').classList.remove('open'); ui(); }
$('#bar').addEventListener('click', e => { const b = e.target.closest('[data-b]'); if (!b) return; const k = b.dataset.b; if (sheetK === k) closeSheet(); else openSheet(k); });
$('#sheet').addEventListener('click', e => {
  if (e.target.closest('[data-x]')) return closeSheet();
  const u = e.target.closest('[data-up]'); if (u && !u.disabled) { const [k, key] = u.dataset.up.split(':'); const up = UP[k].find(x => x.k === key); const c = up.cost(S[k][key]); if (S.chips >= c) { S.chips -= c; S[k][key]++; if (k === 'dice' && key === 'n') D.dice = []; const m = M[k]; coins(m.x + m.w / 2, m.y + m.h / 2, 20); floatTxt(m.x + m.w / 2, m.y + 30, '⬆ ' + up.n, '#3dff8a', 20); renderSheet(); ui(); } return; }
  const ul = e.target.closest('[data-unlock]'); if (ul && !ul.disabled) return unlock(ul.dataset.unlock);
  const tl = e.target.closest('[data-tal]'); if (tl) { const x = ALLT.find(y => y.id === tl.dataset.tal); if (has(x.id)) return; if (x.req && !has(x.req)) return toast('Schalte zuerst das Talent darüber frei.'); if (S.dust < x.c) return toast(`Dafür brauchst du ${x.c} ✨ Glücksstaub.`); S.dust -= x.c; S.tal[x.id] = 1; toast(`${x.e} ${x.n} freigeschaltet!`); flash = 0.3; renderSheet(); ui(); return; }
  if (e.target.closest('[data-bank]')) return prestige();
});
function unlock(k) {
  const c = unlockCost(k); if (S.chips < c) return; S.chips -= c; S[k].own = 1; const m = M[k];
  coins(m.x + m.w / 2, m.y + m.h / 2, 90); flash = 0.5; shake = 8; floatTxt(m.x + m.w / 2, m.y + m.h / 2, m.name + ' gebaut!', '#3dff8a', 34);
  if (k === 'scr') { RS.cd = 1; } renderSheet(); ui(); setTimeout(() => { fit(); }, 400);
}
function prestige() {
  const st = starsFor(S.run); if (st <= 0) return;
  modal(`<h2>♻️ Bankrott!</h2><p>Du verspielst alles – und bekommst <b>${st} ⭐ Glücksstern${st === 1 ? '' : 'e'}</b>.<br>Danach: +${(S.stars + st) * 20} % auf alle Gewinne.</p><button class="big" data-ok>Alles auf Neu!</button><p><button class="x" style="border:0;background:none;color:var(--muted)" data-cancel>Doch nicht</button></p>`, ok => {
    if (!ok) return;
    const keep = { dust: S.dust, stars: S.stars + st, tal: S.tal, life: S.life, resets: S.resets + 1, stats: S.stats };
    S = Object.assign(fresh(), keep);
    D.dice = []; SL.free = 0; RS.stack = []; RS.cur = null; PL.balls = []; tokens.length = 0;
    closeSheet(); flash = 1; shake = 20; fit(); save(); toast(`⭐ ${S.stars} Glückssterne – viel Glück im neuen Leben!`);
  });
}
function modal(html, cb) { const m = $('#modal'); $('#mbox').innerHTML = html; m.style.display = 'flex'; m.onclick = e => { if (e.target.closest('[data-ok]')) { m.style.display = 'none'; cb && cb(true); } else if (e.target.closest('[data-cancel]') || e.target === m) { m.style.display = 'none'; cb && cb(false); } }; }
let toastT = null; function toast(s) { const t = $('#toast'); t.textContent = s; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => (t.style.opacity = 0), 2600); }

/* ---------- Eingabe: Tippen, Rubbeln, Verschieben, Zoomen ---------- */
const ptrs = new Map(); let drag = null, pinch = null;
function inM(k, wx, wy) { const m = M[k]; return wx >= m.x && wx <= m.x + m.w && wy >= m.y - 50 && wy <= m.y + m.h; }
function tapWorld(wx, wy) {
  if (gold && Math.hypot(wx - gold.x, wy - gold.y) < gold.r + 20) return catchGold();
  for (const k of ['slot', 'scr', 'plk']) if (!owned(k) && nextLocked(k) && inM(k, wx, wy)) { if (S.chips >= unlockCost(k)) unlock(k); else openSheet(k); return; }
  if (inM('dice', wx, wy)) { if (D.cd <= 0 && D.rolling <= 0) rollDice(false); return; }
  if (owned('slot') && inM('slot', wx, wy)) { if (SL.cd <= 0 && SL.spin <= 0) { SL.fromPipe = false; startSpin(false, false); } return; }
  if (owned('plk') && inM('plk', wx, wy)) { if (PL.cd <= 0) { PL.cd = plkCd(); dropBall(false, false, clamp(wx, M.plk.x + 60, M.plk.x + M.plk.w - 60)); } return; }
}
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.z }; drag = null; return; }
  const [wx, wy] = toWorld(e.clientX, e.clientY);
  const scratching = owned('scr') && inM('scr', wx, wy) && (RS.cur || RS.stack.length) && RS.doneT <= 0;
  drag = { sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y, moved: false, scratch: scratching };
  if (scratching) scratchAt(wx, wy, 0.25);
  cam.tx = null;
});
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size >= 2) { const [a, b] = [...ptrs.values()]; cam.z = clamp(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, 0.2, 2); return; }
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (drag.scratch) { const [wx, wy] = toWorld(e.clientX, e.clientY); scratchAt(wx, wy, 0.12); if (Math.hypot(dx, dy) > 6) drag.moved = true; return; }
  if (Math.hypot(dx, dy) > 8) drag.moved = true;
  if (drag.moved) { cam.x = drag.cx - dx / cam.z; cam.y = drag.cy - dy / cam.z; }
});
const up = e => {
  ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null;
  if (drag && !drag.moved && !drag.scratch) { const [wx, wy] = toWorld(e.clientX, e.clientY); tapWorld(wx, wy); }
  if (ptrs.size === 0) drag = null;
};
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { e.preventDefault(); const [wx, wy] = toWorld(e.clientX, e.clientY); const nz = clamp(cam.z * Math.exp(-e.deltaY * 0.0015), 0.2, 2); cam.x = wx - (e.clientX - W / 2) / nz; cam.y = wy - (e.clientY - H / 2) / nz; cam.z = nz; cam.tx = null; }, { passive: false });
$('#zoomui').addEventListener('click', e => { const b = e.target.closest('[data-z]'); if (!b) return; const z = b.dataset.z; if (z === 'fit') return fit(); cam.tx = cam.x; cam.ty = cam.y; cam.tz = clamp(cam.z * (z === 'in' ? 1.3 : 1 / 1.3), 0.2, 2); });
addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); if (D.cd <= 0 && D.rolling <= 0) rollDice(false); } if (e.key === 'Escape') closeSheet(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);
function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; const nl = W / H < 0.95 ? 'hoch' : 'quer'; if (nl !== layoutName) { applyLayout(nl); fit(true); } }
addEventListener('resize', () => { resize(); });

/* ---------- Start & Offline-Gewinn ---------- */
resize(); fit(true);
(function offline() {
  const away = Math.min(12 * 3600, (Date.now() - (S.t || Date.now())) / 1000);
  if (away > 60 && S.rate > 0) {
    const v = S.rate * away * (has('nacht') ? 1 : 0.5); S.chips += v; S.run += v; S.life += v;
    const h = Math.floor(away / 3600), m = Math.floor((away % 3600) / 60);
    setTimeout(() => modal(`<h2>Willkommen zurück!</h2><p>Deine Helfer haben ${h ? h + ' Std. ' : ''}${m} Min. weitergespielt.</p><p style="font:400 30px var(--display);color:var(--gold)">+${fmt(v)} 🪙</p><button class="big" data-ok>Einsammeln</button>`, () => { coins(M.dice.x + 200, M.dice.y + 100, 80); flash = 0.4; }), 300);
  } else if (!S.life) setTimeout(() => modal(`<h2>🎰 Glückspalast</h2><p>Tippe auf den Würfeltisch und würfle dein erstes Vermögen.<br>Kauf neue Maschinen – sie stehen alle nebeneinander und sind über Röhren verbunden: Paschs werfen Münzen in den Automaten, Dreier schießen Kugeln ins Plinko …</p><p style="color:var(--muted);font-size:13px">Verschieben: ziehen · Zoomen: zwei Finger oder Mausrad</p><button class="big" data-ok>Los geht’s!</button>`), 300);
})();
requestAnimationFrame(frame);
</script>
</body>
