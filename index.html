<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Glückspalast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0716;--panel:#1a1230;--panel2:#241a40;--line:#3b2d62;--fg:#f4eefe;--muted:#a99cc8;--gold:#ffd23f;--pink:#ff3fa4;--cyan:#22e3ff;--green:#3dff8a;--display:'Bungee',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;cursor:pointer}
#top{position:fixed;left:0;right:0;top:0;padding:max(8px,env(safe-area-inset-top)) 10px 8px;display:flex;gap:6px;align-items:center;pointer-events:none;z-index:5;flex-wrap:wrap}
.cur{pointer-events:auto;display:flex;align-items:center;gap:7px;background:rgba(20,13,38,.82);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:5px 11px 5px 6px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.cur .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px}
.cur b{font:400 18px var(--display);letter-spacing:.02em;display:block;line-height:1}
.cur small{color:var(--muted);font-size:10.5px;font-weight:700;white-space:nowrap}
.chipic{background:radial-gradient(circle at 35% 30%,#fff6c8,#ffd23f 45%,#c98a00);box-shadow:0 0 14px rgba(255,210,63,.6)}
.dustic{background:radial-gradient(circle at 35% 30%,#ffe0ff,#c66bff 50%,#6a1fb0);box-shadow:0 0 14px rgba(198,107,255,.6)}
.staric{background:radial-gradient(circle at 35% 30%,#fff,#9fe9ff 50%,#1f7ab0);box-shadow:0 0 14px rgba(34,227,255,.5)}
.licic{background:radial-gradient(circle at 35% 30%,#fff,#ff9de2 50%,#b01f7a);box-shadow:0 0 14px rgba(255,63,164,.5)}
#top .sp{flex:1}
.ver{pointer-events:auto;font:800 11px var(--body);color:#1b1400;background:var(--gold);border-radius:99px;padding:3px 8px}
#casinoName{pointer-events:none;font:400 12px var(--display);color:#fff;opacity:.75;text-shadow:0 0 10px var(--pink)}
#boost{pointer-events:none;position:fixed;top:calc(max(8px,env(safe-area-inset-top)) + 54px);left:50%;transform:translateX(-50%);z-index:5;font:400 14px var(--display);color:#1b1400;background:linear-gradient(90deg,#ffd23f,#ff8a3d);padding:6px 14px;border-radius:99px;box-shadow:0 0 24px rgba(255,180,0,.6);display:none;animation:pulse 1s infinite;white-space:nowrap}
#chain{pointer-events:none;position:fixed;top:calc(max(8px,env(safe-area-inset-top)) + 118px);left:50%;transform:translate(-50%,-50%);z-index:6;font:400 clamp(18px,4.5vw,32px) var(--display);color:#fff;text-shadow:0 0 18px var(--pink),0 0 40px var(--pink);opacity:0;transition:opacity .3s;white-space:nowrap}
#chal{pointer-events:none;position:fixed;top:calc(max(8px,env(safe-area-inset-top)) + 54px);right:10px;z-index:5;background:rgba(90,20,40,.9);border:1px solid #ff4d6d;border-radius:12px;padding:6px 10px;font:800 12px var(--body);display:none;max-width:200px}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.06)}}
#bigwin{position:fixed;inset:0;z-index:15;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;background:radial-gradient(circle,rgba(255,180,0,.25),rgba(5,3,12,.6) 70%)}
#bigwin .t{font:400 clamp(44px,13vw,110px) var(--display);background:linear-gradient(180deg,#fff7c8,#ffd23f 40%,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #7a3d00) drop-shadow(0 0 30px rgba(255,180,0,.7));animation:bw .8s cubic-bezier(.2,1.5,.4,1) both}
#bigwin .v{font:400 clamp(28px,8vw,60px) var(--display);color:#fff;text-shadow:0 0 20px #ffd23f;margin-top:6px}
@keyframes bw{from{transform:scale(.2) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
#bar{position:fixed;left:0;right:0;bottom:0;padding:8px 8px max(8px,env(safe-area-inset-bottom));display:flex;gap:6px;justify-content:center;z-index:9;pointer-events:none}
#bar button{pointer-events:auto;position:relative;width:58px;height:58px;border-radius:18px;border:1px solid var(--line);background:rgba(26,18,48,.92);backdrop-filter:blur(8px);font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 8px 20px rgba(0,0,0,.4);transition:transform .12s}
#bar button small{font:800 9px var(--body);color:var(--muted)}
#bar button:active{transform:scale(.92)}
#bar button.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,210,63,.4),0 8px 20px rgba(0,0,0,.4)}
#bar button .dot{position:absolute;top:5px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);display:none}
#bar button.can .dot{display:block}
#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:min(100%,600px);max-height:min(60vh,580px);overflow:auto;z-index:8;background:rgba(22,15,42,.97);backdrop-filter:blur(12px);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:14px 14px calc(80px + env(safe-area-inset-bottom));transition:transform .32s cubic-bezier(.2,.9,.3,1);box-shadow:0 -20px 50px rgba(0,0,0,.5);touch-action:pan-y}
#sheet.open{transform:translate(-50%,0)}
#sheet h2{margin:0;font:400 19px var(--display);display:flex;align-items:center;gap:8px}
#sheet .x{margin-left:auto;border:0;background:var(--panel2);border-radius:12px;width:36px;height:36px;font-size:16px}
#sheet p.d{color:var(--muted);margin:4px 0 10px;font-size:13.5px}
#sheet h3{font:400 14px var(--display);color:var(--gold);margin:14px 0 6px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:7px 11px;font:800 13px var(--body)}
.tabs button.on{background:var(--gold);color:#1b1400;border-color:var(--gold)}
.tabs button.lock{opacity:.45}
.up{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:7px}
.up .i{font-size:24px;text-align:center}
.up b{font-size:14.5px}.up small{display:block;color:var(--muted);font-size:12.5px}
.up button{border:0;border-radius:12px;padding:9px 11px;min-width:92px;font:800 13.5px var(--body);background:linear-gradient(180deg,#ffd23f,#f0a500);color:#1b1400;box-shadow:0 4px 0 #8a5a00}
.up button.st{background:linear-gradient(180deg,#9fe9ff,#1fa0d6);box-shadow:0 4px 0 #0a4a6a}
.up button.li{background:linear-gradient(180deg,#ff9de2,#d61f8a);box-shadow:0 4px 0 #6a0a4a;color:#fff}
.up button:disabled{background:#3b2d62;color:#8a7cae;box-shadow:none}
.up button:not(:disabled):active{transform:translateY(2px)}
.up.max button{background:#27a06a;color:#fff;box-shadow:none}
.up.lockd{opacity:.5}
.tal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tal .br{display:flex;flex-direction:column;gap:6px}
.tal h4{margin:4px 0 0;font:400 11.5px var(--display);color:var(--muted);text-align:center}
.tn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:7px 4px;text-align:center;font-size:11px;line-height:1.2;transition:transform .12s}
.tn .e{font-size:21px;display:block}.tn b{display:block;font-size:11.5px;margin:2px 0}
.tn.own{border-color:#c66bff;background:linear-gradient(180deg,rgba(198,107,255,.3),var(--panel));box-shadow:0 0 12px rgba(198,107,255,.35)}
.tn.lock{opacity:.38}.tn .c{display:inline-block;margin-top:3px;font-weight:800;color:#e6b3ff}
.tn.can{border-color:#3dff8a}
@media (max-width:480px){.tal{grid-template-columns:repeat(2,1fr)}}
.big{width:100%;border:0;border-radius:16px;padding:13px;font:400 17px var(--display);background:linear-gradient(90deg,#ff3fa4,#a46bff);color:#fff;box-shadow:0 6px 0 #5a1f70;margin-top:6px}
.big:disabled{background:#3b2d62;box-shadow:none;color:#8a7cae}
.ms{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:6px;font-size:13px}
.ms b.n{font:400 18px var(--display);text-align:center;color:var(--muted)}
.ms.done{border-color:#27a06a;background:linear-gradient(90deg,rgba(39,160,106,.2),var(--panel))}.ms.done b.n{color:var(--green)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.ach div{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px;font-size:11.5px;text-align:center;opacity:.45}
.ach div.ok{opacity:1;border-color:var(--gold);background:linear-gradient(180deg,rgba(255,210,63,.18),var(--panel))}
.ach div span{font-size:22px;display:block}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:12;background:rgba(20,13,38,.96);border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#modal{position:fixed;inset:0;z-index:20;background:rgba(5,3,12,.75);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;max-width:440px;text-align:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;max-height:85vh;overflow:auto}
#modal h2{font:400 24px var(--display);margin:0 0 8px;color:var(--gold)}
#modal .row{display:flex;gap:8px}#modal .row .big{flex:1}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
#zoomui{position:fixed;right:10px;bottom:calc(84px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;z-index:4}
#zoomui button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(26,18,48,.85);font-size:18px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <div class="cur"><span class="ic chipic">🪙</span><div><b id="vChips">0</b><small id="vRate">0 / s</small></div></div>
  <div class="cur" id="dustBox" style="display:none"><span class="ic dustic">✨</span><div><b id="vDust">0</b><small>Staub</small></div></div>

<script>
'use strict';
/* =====================================================================
   Glückspalast v0.2 – Idle-Glücksspiel-Konstrukt
   8 Maschinen auf einem Feld, über Röhren verbunden:
   Würfel → Automat / Rubbellos → Plinko → Glücksrad → Roulette → Karten → Jackpot-Tresor
   Ebene 1: Bankrott (Glückssterne, Stern-Shop, Meilensteine)
   Ebene 2: Casino-Umzug (Lizenzen, neue Casinos mit Sonderregeln)
   ===================================================================== */
const $ = s => document.querySelector(s);
const cv = $('#c'), cx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- Zahlen ---------- */
const UNITS = ['', ' Tsd.', ' Mio.', ' Mrd.', ' Bio.', ' Brd.', ' Trio.', ' Trd.', ' Quad.', ' Qrd.', ' Quin.', ' Qird.'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1).replace('.', ',') : Math.floor(n).toString();
  const e = Math.floor(Math.log10(n) / 3);
  let u = UNITS[e];
  if (u === undefined) { const k = e - UNITS.length; u = ' ' + String.fromCharCode(97 + (Math.floor(k / 26) % 26)) + String.fromCharCode(97 + (k % 26)); }
  const v = n / Math.pow(1000, e);
  return (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2)).replace('.', ',') + u;
}

/* ---------- Spielstand ---------- */
const SAVE_KEY = 'gp.save.v2';
const RUN = () => ({
  chips: 0, run: 0, free: 0, runT: 0,
  dice: { n: 1, face: 0, speed: 0, gold: 0, auto: 0, glass: 0, joker: 0, split: 0, fire: 0 },
  slot: { own: 0, reels: 3, val: 0, speed: 0, auto: 0 },
  scr: { own: 0, rate: 0, luck: 0, val: 0, auto: 0 },
  plk: { own: 0, val: 0, rows: 0, multi: 0, auto: 0 },
  rad: { own: 0, val: 0, fields: 0, speed: 0, auto: 0 },
  roul: { own: 0, val: 0, fav: 0, speed: 0, auto: 0 },
  card: { own: 0, val: 0, deck: 0, gold: 0, auto: 0 },
  tres: { own: 0, val: 0, need: 0 },
});
const fresh = () => ({ ...RUN(), life: 0, dust: 0, stars: 0, starsLife: 0, resets: 0, ms: 0, tal: {}, shop: {}, lic: 0, licLife: 0, casino: 0, lshop: {}, ach: {}, chalDone: {}, chal: null, t: Date.now(), rate: 0, best: 0,
  stats: { rolls: 0, kniffel: 0, spins: 0, jack: 0, tickets: 0, balls: 0, chain: 0, wheels: 0, roul: 0, hands: 0, royal: 0, tres: 0, gold: 0, high: 0 } });
function merge(def, src) { if (!src || typeof src !== 'object') return def; const o = { ...def }; for (const k in src) { if (def[k] && typeof def[k] === 'object' && !Array.isArray(def[k]) && Object.keys(def[k]).length) o[k] = merge(def[k], src[k]); else o[k] = src[k]; } return o; }
let S = fresh();
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s) S = merge(fresh(), s); } catch {}
// Spielstand aus v0.1: verdiente Sterne zählen weiter
if (S.stars && !S.starsLife) S.starsLife = S.stars;
const save = () => { S.t = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch {} };

/* ---------- Casinos (Ebene 2) ---------- */
const CASINOS = [
  { n: 'Hinterhof', d: 'Keine Sonderregel – hier fängt alles an.', bg: ['#24123f', '#0e0820'], pat: 'rgba(255,63,164,.05)' },
  { n: 'Riviera', d: 'Goldwürfel kommen doppelt so oft. Sonne, Meer, Chips.', bg: ['#123a4f', '#071a26'], pat: 'rgba(80,220,255,.06)', gold: 2 },
  { n: 'Las Vegas', d: 'Automaten zahlen ×3, Würfel nur ×0,7.', bg: ['#3f1230', '#1a0614'], pat: 'rgba(255,210,63,.06)', slot: 3, dice: 0.7 },
  { n: 'Macau', d: 'Kartentisch ×3, Röhren doppelt so schnell.', bg: ['#3f0f12', '#1a0608'], pat: 'rgba(255,80,80,.06)', card: 3, pipe: 2 },
  { n: 'Unterwasser-Kuppel', d: 'Plinko-Randfächer zahlen doppelt, Kugeln sinken langsamer.', bg: ['#0f2f4f', '#04121f'], pat: 'rgba(60,200,255,.07)', plk: 2, grav: 0.6 },
  { n: 'Mondbasis', d: 'Kombis zählen doppelt, aber Würfel rollen länger.', bg: ['#1f1f2f', '#07070d'], pat: 'rgba(200,200,255,.05)', combo: 2, roll: 1.6 },
  { n: 'Neon-Galaxie', d: 'Alles ×2, Ketten halten doppelt so lang.', bg: ['#2a0f4f', '#08031a'], pat: 'rgba(164,107,255,.08)', all: 2, chainT: 2 },
];
function casino() { const i = S.casino || 0; if (i < CASINOS.length) return CASINOS[i]; const k = i - CASINOS.length + 1; return { n: `Sektor ${k}`, d: `Tiefer im All: alles ×${fmt(2 * Math.pow(3, k))}, aber Maschinen und Upgrades ×${fmt(Math.pow(2, k))} teurer.`, bg: [`hsl(${(k * 47) % 360},45%,16%)`, '#05030c'], pat: `hsla(${(k * 47) % 360},90%,70%,.07)`, all: 2 * Math.pow(3, k), costMul: Math.pow(2, k), chainT: 2 }; }
const cs = k => casino()[k];

/* ---------- Talente (Glücksstaub) ---------- */
const TAL = [
  { b: 'Würfel', list: [
    { id: 'gezinkt', e: '🎲', n: 'Gezinkt', d: 'Würfel zeigen nie eine 1', c: 3 },
    { id: 'goldader', e: '🟨', n: 'Goldader', d: '+5 % Goldwürfel', c: 6 },
    { id: 'sechser', e: '6️⃣', n: 'Sechser-Glück', d: 'Sechsen zählen doppelt', c: 12 },
    { id: 'kniffelstaub', e: '💫', n: 'Sternenwurf', d: 'Kniffel gibt 3 Staub', c: 25 },
    { id: 'wmeister', e: '🏅', n: 'Würfelmeister', d: 'Würfel ×3', c: 70 },
    { id: 'kombi', e: '🎯', n: 'Kombi-König', d: 'Kombis zählen doppelt', c: 180 } ] },
  { b: 'Automaten', list: [
    { id: 'oel', e: '🛢️', n: 'Schmieröl', d: 'Alle Maschinen 25 % schneller', c: 3 },
    { id: 'wild', e: '🃏', n: 'Wilde Karte', d: 'Doppelt so viele Joker', c: 7 },
    { id: 'roehre', e: '🧪', n: 'Jackpot-Röhre', d: 'Jeder Dreier: +1 Kugel', c: 14 },
    { id: 'klee', e: '🍀', n: 'Glücksklee', d: 'Lose gewinnen öfter', c: 20 },
    { id: 'walzen', e: '🎰', n: 'Walzenkönig', d: 'Automat ×3', c: 70 },
    { id: 'kanone', e: '💥', n: 'Großkaliber', d: 'Plinko & Rad ×3', c: 180 } ] },
  { b: 'Glück', list: [
    { id: 'kapital', e: '💼', n: 'Startkapital', d: 'Maschinen kosten die Hälfte', c: 4 },
    { id: 'kette', e: '⛓️', n: 'Kettenreaktion', d: '+10 % statt +5 % pro Kettenglied', c: 8 },
    { id: 'nacht', e: '🌙', n: 'Nachtschicht', d: 'Offline 100 % statt 50 %', c: 10 },
    { id: 'sauger', e: '🌀', n: 'Staubsauger', d: '+50 % Glücksstaub', c: 18 },
    { id: 'goldfieber', e: '🌟', n: 'Goldfieber', d: 'Goldene Chips doppelt so oft', c: 60 },
    { id: 'sternf', e: '🌠', n: 'Sternschnuppe', d: '+25 % Sterne beim Bankrott', c: 200 } ] },
  { b: 'Röhren', ms: 2, list: [
    { id: 'turbo', e: '🚀', n: 'Turbo-Röhren', d: 'Röhren doppelt so schnell', c: 12 },
    { id: 'doppler', e: '✖️', n: 'Verdoppler', d: '15 % Chance: Ladung kommt doppelt an', c: 30 },
    { id: 'speicher', e: '📦', n: 'Großspeicher', d: '+15 Freispiele Speicher', c: 45 },
    { id: 'tresorader', e: '🏦', n: 'Tresor-Ader', d: 'Ketten füllen den Tresor doppelt', c: 90 },
    { id: 'magnet', e: '🧲', n: 'Rad-Magnet', d: 'Plinko-Fächer ab 3× drehen das Rad', c: 140 },
    { id: 'endlos', e: '♾️', n: 'Endlos-Kette', d: 'Ketten halten doppelt so lang', c: 260 } ] },
];
const has = id => !!S.tal[id];
const ALLT = TAL.flatMap(b => b.list.map((x, i) => ({ ...x, br: b, req: i ? b.list[i - 1].id : null })));

/* ---------- Stern-Shop (Ebene 1) ---------- */
const SHOP = [
  { id: 'glanz', e: '✨', n: 'Sternenglanz', d: l => `Alle Gewinne ×${fmt(Math.pow(2, l))}`, c: l => Math.ceil(3 * Math.pow(6, l)) },
  { id: 'startw', e: '🎲', n: 'Würfelvorrat', d: l => `Start mit ${1 + l * 2} Würfeln`, c: l => Math.ceil(Math.pow(2, l)), max: 6 },

function openSheet(k, sub) { sheetK = k; if (sub) machTab = sub; $('#sheet').classList.add('open'); renderSheet(); if (k === 'mach') focus(machTab); ui(); }
